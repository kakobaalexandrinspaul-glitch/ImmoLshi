<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Contrats — ImmoLshi</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/contrats.css">
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <!-- BARRE DE NAVIGATION EN HAUT -->
  <header class="dash-navbar">
    <div class="nav-left-brand">
      <div class="brand-logo">
        <div class="logo-icon-box">
          <i class="fa-solid fa-hotel"></i>
        </div>
        <div class="logo-titles">
          <span class="logo-main">ImmoLshi</span>
          <span class="logo-sub">LUBUMBASHI</span>
        </div>
      </div>
    </div>
    
    <div class="nav-center-links">
      <a href="../index.html">Accueil</a>
      <a href="annonces.html">Annonces</a>
    </div>

    <div class="nav-right-user">
      <button class="icon-action-btn" aria-label="Mode sombre"><i class="fa-regular fa-moon"></i></button>
      <button class="icon-action-btn" aria-label="Notifications"><i class="fa-regular fa-bell"></i></button>
      <div class="user-profile-dropdown">
        <div class="dropdown-trigger">
          <img src="https://unsplash.com" alt="Eric" class="nav-avatar">
          <span class="nav-username">Eric</span>
          <i class="fa-solid fa-chevron-down"></i>
        </div>
      </div>
      <button class="burger-menu-btn" aria-label="Menu mobile"><i class="fa-solid fa-bars"></i></button>
    </div>
  </header>

  <!-- DISPOSITION PRINCIPALE -->
  <div class="main-dashboard-wrapper">
    
    <!-- MENU LATÉRAL GAUCHE (SIDEBAR) -->
    <aside class="sidebar-panel">
      <div class="sidebar-profile-card">
        <img src="https://unsplash.com" alt="Eric Mukendi" class="profile-large-avatar">
        <h3 class="profile-name">Eric Mukendi</h3>
        <span class="profile-email">eric.mukendi@gmail.com</span>
        <span class="status-badge">Client actif</span>
      </div>

      <nav class="sidebar-navigation">
        <a href="dashboard.html" class="nav-item-link"><i class="fa-solid fa-table-cells-large"></i> Aperçu</a>
        <a href="reservations.html" class="nav-item-link"><i class="fa-regular fa-calendar"></i> Réservations</a>
        <a href="favoris.html" class="nav-item-link"><i class="fa-regular fa-heart"></i> Favoris</a>
        <a href="contrats.html" class="nav-item-link active"><i class="fa-regular fa-file-lines"></i> Contrats</a>
        <a href="historique.html" class="nav-item-link"><i class="fa-solid fa-clock-rotate-left"></i> Historique</a>
      </nav>

      <div class="sidebar-footer-action">
        <a href="annonces.html" class="btn-search-property">Chercher un bien</a>
      </div>
    </aside>

    <!-- ZONE DE CONTENU PRINCIPALE (PANNEAU DROIT) -->
    <main class="content-display-panel">
      
      <div class="welcome-header">
        <h1 class="page-main-title">Mes contrats</h1>
      </div>

      <!-- Liste des lignes de documents administratifs -->
      <div class="contracts-list-stack">
        
        <!-- BLOC DOCUMENT 1 -->
        <div class="contract-row-card">
          <div class="contract-meta-info">
            <h3>Villa moderne avec piscine — Golf</h3>
            <p class="contract-sub-details">Signé le 14/06/2026 · 280,000 USD</p>
          </div>
          
          <div class="contract-action-buttons">
            <button type="button" class="btn-download-pdf"><i class="fa-solid fa-download"></i> Contrat PDF</button>
            <button type="button" class="btn-download-receipt"><i class="fa-solid fa-download"></i> Reçu</button>
          </div>
        </div>

      </div>
    </main>

  </div>

  <button class="floating-help-btn" aria-label="Aide">?</button>

</body>
</html>
