<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — ImmoLshi</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/inscription.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="auth-container">
    <a href="index.html" class="back-home-btn">
      <i class="fa-solid fa-arrow-left"></i> Retour à l'accueil
    </a>

    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-box">
          <i class="fa-solid fa-building-user"></i>
        </div>
        <h2>Créer un compte</h2>
        <p>Rejoignez ImmoLshi pour publier vos offres ou trouver votre futur bien.</p>
      </div>

      <form action="dashboard.html" method="POST" class="auth-form" novalidate>
        <div class="form-group">
          <label for="fullname">Nom complet</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-user input-icon"></i>
            <input type="text" id="fullname" name="fullname" autocomplete="name" placeholder="Ex: alexandrins Paul Kakoba Jr" required>
          </div>
          <span class="field-error" id="fullnameError"></span>
        </div>

        <div class="form-group">
          <label for="email">Adresse email</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="exemple@immo-lshi.cd" required>
          </div>
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="phone">Numéro de téléphone</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-phone input-icon"></i>
            <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="Ex: +243 975 000 100" required>
          </div>
          <span class="field-error" id="phoneError"></span>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" name="password" autocomplete="new-password" placeholder="••••••••" required>
          </div>
          <span class="field-error" id="passwordError"></span>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" name="terms" id="terms" required>
            <span class="checkmark"></span>
            J'accepte les <a href="#" class="terms-link">conditions d'utilisation</a>
          </label>
          <span class="field-error" id="termsError"></span>
        </div>

        <div class="form-message" id="formMessage"></div>

        <button type="submit" class="btn-auth-submit">
          S'inscrire <i class="fa-solid fa-user-plus"></i>
        </button>
      </form>

      <div class="auth-footer">
        <p>Déjà membre ? <a href="connexion.html">Connectez-vous ici</a></p>
      </div>
    </div>
  </div>
</body>
</html>
